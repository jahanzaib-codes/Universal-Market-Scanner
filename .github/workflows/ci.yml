name: CI & Code Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Static Syntax & Safety Validation
      run: |
        # Stop build on critical syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82,F824 --show-source --statistics
        # Exit-zero for style advisory
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Verify Screener Demonstration Run
      run: |
        python cli.py demo
