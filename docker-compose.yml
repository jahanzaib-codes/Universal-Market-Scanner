version: '3.8'

services:
  market-scanner:
    build: .
    container_name: universal_market_scanner
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SCANNER_SERVER_HOST=0.0.0.0
      - SCANNER_SERVER_PORT=8000
      - DEFAULT_MIN_RVOL=2.0
    volumes:
      - ./:/app
